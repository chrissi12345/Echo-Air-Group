<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101410">
<meta name="description" content="Echo Air Group — a modern virtual airline community for flight simulation enthusiasts.">
<title>Echo Air Group — Virtual Airline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
/* ============================================================
   ECHO AIR GROUP — ENHANCED HOMEPAGE
   ============================================================
   This version intentionally keeps everything in one HTML file
   so it is easy to copy, test and customize.
   ------------------------------------------------------------
   QUICK IMAGE CUSTOMIZATION:
   1. Search for "CUSTOM IMAGE".
   2. Replace the URL in that section.
   3. If you do not have an image yet, the gradient remains.
   ============================================================ */

:root {
    --green: #ace336;
    --green-dark: #6e9c1e;
    --green-soft: #eef6df;
    --black: #090d08;
    --dark: #101410;
    --dark-2: #151b13;
    --dark-3: #202b1b;
    --white: #ffffff;
    --light: #f5f7f3;
    --text: #273025;
    --muted: #687267;
    --line: rgba(255,255,255,.09);
    --light-line: #e0e6dc;
    --shadow: 0 20px 60px rgba(20,30,15,.10);
    --radius: 20px;
    --header-height: 100px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 110px;
}

body {
    margin: 0;
    overflow-x: hidden;
    font-family: Inter, Arial, sans-serif;
    color: var(--text);
    background: var(--white);
}

body.menu-open {
    overflow: hidden;
}

img {
    max-width: 100%;
}

button,
a {
    font-family: inherit;
}

button {
    border: 0;
}

::selection {
    background: var(--green);
    color: var(--black);
}

/* ============================================================
   ACCESSIBILITY
   ============================================================ */

.skip-link {
    position: fixed;
    top: -100px;
    left: 20px;
    z-index: 9999;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--green);
    color: var(--black);
    font-weight: 800;
    text-decoration: none;
}

.skip-link:focus {
    top: 20px;
}

:focus-visible {
    outline: 3px solid var(--green);
    outline-offset: 4px;
}

/* ============================================================
   GLOBAL HELPERS
   ============================================================ */

.container {
    width: min(1180px, calc(100% - 50px));
    margin: 0 auto;
}

.container-wide {
    width: min(1400px, calc(100% - 50px));
    margin: 0 auto;
}

.text-center {
    text-align: center;
}

.desktop-only {
    display: block;
}

.mobile-only {
    display: none;
}

.green {
    color: var(--green);
}

.light-green {
    color: var(--green-dark);
}

.muted {
    color: var(--muted);
}

.hidden {
    display: none !important;
}

/* ============================================================
   HEADER
   ============================================================ */

header {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 1000;
    width: 100%;
    background: rgba(9,13,8,1);
    border-bottom: 1px solid rgba(255,255,255,.06);
    transition:
        background .3s ease,
        backdrop-filter .3s ease,
        box-shadow .3s ease,
        border-color .3s ease,
        transform .3s ease;
}

header.scrolled {
    background: rgba(9,13,8,.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(172,227,54,.14);
    box-shadow: 0 8px 35px rgba(0,0,0,.25);
}

header.hide-on-scroll {
    transform: translateY(-100%);
}

.nav {
    min-height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    display: inline-flex;
    align-items: center;
    min-width: 0;
    flex-shrink: 0;
    color: var(--white);
    text-decoration: none;
}

.brand-logo {
    width: 58px;
    height: 58px;
    display: block;
    object-fit: contain;
    border-radius: 12px;
}

.brand-text {
    margin-left: 12px;
    color: var(--white);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: .04em;
    line-height: 1.2;
}

.brand-text small {
    display: block;
    margin-top: 4px;
    color: var(--green);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
}

.navlinks {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    margin-left: auto;
}

.navlinks a {
    position: relative;
    color: rgba(255,255,255,.9);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    transition: color .2s ease, transform .2s ease;
}

.navlinks a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 100%;
    bottom: -8px;
    height: 2px;
    background: var(--green);
    transition: right .25s ease;
}

.navlinks a:hover,
.navlinks a.active {
    color: var(--green);
}

.navlinks a:hover::after,
.navlinks a.active::after {
    right: 0;
}

.register {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 10px;
    background: var(--green);
    color: #17200f;
    text-decoration: none;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
    transition: transform .2s ease, box-shadow .2s ease;
}

.register:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(172,227,54,.25);
}

.menu {
    display: none;
    padding: 10px 13px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

/* ============================================================
   MOBILE NAV
   ============================================================ */

.mobileNav {
    display: none;
    background: rgba(9,13,8,.98);
    border-top: 1px solid rgba(255,255,255,.06);
}

.mobileNav.open {
    display: block;
}

.mobileNav .container {
    padding: 15px 0 25px;
}

.mobileNav a {
    display: block;
    padding: 14px 0;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-size: 15px;
    font-weight: 800;
}

.mobileNav a:hover {
    color: var(--green);
}

/* ============================================================
   HERO
   ============================================================ */

.hero {
    position: relative;
    min-height: 820px;
    display: flex;
    align-items: center;
    overflow: hidden;
    padding-top: var(--header-height);
    color: white;
    background:
        radial-gradient(circle at 80% 25%, rgba(172,227,54,.15), transparent 28%),
        linear-gradient(135deg, #10150f 0%, #172016 50%, #0d110c 100%);
}

.hero-background-image {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
        linear-gradient(90deg, rgba(9,13,8,.98) 0%, rgba(9,13,8,.86) 43%, rgba(9,13,8,.35) 100%),
        url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2200&q=85")
        center / cover no-repeat;
    opacity: .78;
    transform: scale(1.04);
    transition: transform 8s ease;
}

.hero:hover .hero-background-image {
    transform: scale(1.08);
}

.hero-grid-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: .15;
    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

.hero-glow {
    position: absolute;
    width: 420px;
    height: 420px;
    right: 6%;
    top: 18%;
    border-radius: 50%;
    background: rgba(172,227,54,.10);
    filter: blur(80px);
    z-index: 1;
    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 4;
    max-width: 760px;
    padding: 110px 0;
    transform: translateX(-80px);
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(172,227,54,.1);
    border: 1px solid rgba(172,227,54,.3);
    color: var(--green);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
}

.dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: pulseDot 2s infinite;
}

@keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 7px var(--green); }
    50% { box-shadow: 0 0 22px var(--green); }
}

.hero h1 {
    margin: 25px 0 20px;
    font-size: clamp(48px, 7vw, 88px);
    line-height: .98;
    letter-spacing: -.06em;
}

.hero h1 span {
    color: var(--green);
}

.hero p {
    max-width: 650px;
    margin: 0;
    color: #c6cdc2;
    font-size: 18px;
    line-height: 1.85;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 13px;
    margin-top: 34px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 13px 21px;
    border-radius: 11px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 850;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
}

.btn:hover {
    transform: translateY(-3px);
}

.btn-primary {
    background: var(--green);
    color: #17200f;
    box-shadow: 0 10px 30px rgba(172,227,54,.15);
}

.btn-primary:hover {
    box-shadow: 0 15px 40px rgba(172,227,54,.28);
}

.btn-outline {
    color: white;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
}

.btn-outline:hover {
    background: rgba(255,255,255,.1);
}

.hero-plane {
    position: absolute;
    z-index: 2;
    right: -90px;
    top: 50%;
    transform: translateY(-50%) rotate(-5deg);
    font-size: min(35vw, 520px);
    color: rgba(255,255,255,.025);
    user-select: none;
    pointer-events: none;
}

.hero-float {
    position: absolute;
    z-index: 5;
    right: 7%;
    bottom: 100px;
    width: 230px;
    padding: 20px 22px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    background: rgba(16,20,14,.68);
    backdrop-filter: blur(16px);
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    line-height: 1.6;
}

.hero-float strong {
    color: white;
}

.hero-float small {
    color: #aeb7aa;
}

/* ============================================================
   HERO QUICK CARDS
   ============================================================ */

.hero-quick {
    position: absolute;
    z-index: 5;
    right: 6%;
    top: 120px;
    display: grid;
    gap: 10px;
    width: 230px;
}

.quick-card {
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px;
    background: rgba(9,13,8,.52);
    backdrop-filter: blur(12px);
}

.quick-card-label {
    display: block;
    margin-bottom: 3px;
    color: #8e9989;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.quick-card-value {
    color: white;
    font-size: 14px;
    font-weight: 800;
}

/* ============================================================
   SCROLL INDICATOR
   ============================================================ */

.scroll-indicator {
    position: absolute;
    z-index: 6;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    color: rgba(255,255,255,.65);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}

.scroll-mouse {
    width: 20px;
    height: 31px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 20px;
    position: relative;
}

.scroll-mouse::before {
    content: "";
    position: absolute;
    width: 3px;
    height: 6px;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 10px;
    background: var(--green);
    animation: scrollDot 1.7s infinite;
}

@keyframes scrollDot {
    0% { opacity: 0; transform: translate(-50%, 0); }
    40% { opacity: 1; }
    80%, 100% { opacity: 0; transform: translate(-50%, 10px); }
}

/* ============================================================
   STATS
   ============================================================ */

.stats {
    position: relative;
    z-index: 10;
    background: var(--dark-3);
    color: white;
    border-top: 1px solid rgba(172,227,54,.15);
    border-bottom: 1px solid rgba(172,227,54,.15);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
}

.stat {
    padding: 30px 20px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,.08);
}

.stat:last-child {
    border-right: none;
}

.stat b {
    display: block;
    margin-bottom: 5px;
    color: var(--green);
    font-size: 30px;
    font-weight: 900;
}

.stat span {
    color: rgba(255,255,255,.72);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
}

/* ============================================================
   GENERAL SECTIONS
   ============================================================ */

.home-section,
.fleet-section,
.news-section,
.operations-section,
.team-section,
.gallery-section,
.faq-section,
.testimonial-section {
    padding: 110px 0;
}

.home-section {
    background: white;
}

.alt {
    background: var(--light);
}

.section-head {
    max-width: 760px;
    margin-bottom: 55px;
}

.section-head.center {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
}

.section-head h2 {
    margin: 10px 0 18px;
    font-size: clamp(36px, 5vw, 58px);
    line-height: 1.02;
    letter-spacing: -.05em;
}

.section-head h2 span {
    color: var(--green-dark);
}

.section-head p {
    margin: 0;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.8;
}

.eyebrow {
    color: var(--green-dark);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
}

/* ============================================================
   EXPERIENCE CARDS
   ============================================================ */

.experience-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.experience-card {
    position: relative;
    overflow: hidden;
    padding: 34px;
    border: 1px solid #e3e8df;
    border-radius: var(--radius);
    background: white;
    box-shadow: 0 12px 35px rgba(20,30,15,.05);
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}

.experience-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 3px;
    background: var(--green);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
}

.experience-card:hover {
    transform: translateY(-7px);
    border-color: rgba(110,156,30,.35);
    box-shadow: 0 25px 60px rgba(20,30,15,.12);
}

.experience-card:hover::before {
    transform: scaleX(1);
}

.experience-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    border-radius: 14px;
    background: var(--green-soft);
    color: var(--green-dark);
    font-size: 22px;
}

.experience-card h3 {
    margin: 0 0 10px;
    font-size: 20px;
}

.experience-card p {
    margin: 0;
    color: var(--muted);
    line-height: 1.7;
}

/* ============================================================
   FEATURED IMAGE / STORY
   ============================================================ */

.story-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 55px;
    align-items: center;
}

.story-image {
    position: relative;
    min-height: 500px;
    overflow: hidden;
    border-radius: 28px;
    background:
        linear-gradient(135deg, rgba(172,227,54,.18), rgba(9,13,8,.75)),
        url("https://images.unsplash.com/photo-1464037866556-6812c9c1c72e?auto=format&fit=crop&w=1400&q=85")
        center / cover no-repeat;
    box-shadow: 0 35px 90px rgba(20,30,15,.18);
}

.story-image::after {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 20px;
    pointer-events: none;
}

.story-badge {
    position: absolute;
    z-index: 2;
    left: 25px;
    bottom: 25px;
    padding: 15px 18px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px;
    background: rgba(9,13,8,.72);
    backdrop-filter: blur(14px);
    color: white;
}

.story-badge strong {
    display: block;
    color: var(--green);
    font-size: 18px;
}

.story-badge span {
    color: #aeb7aa;
    font-size: 11px;
}

.story-content h3 {
    margin: 10px 0 16px;
    font-size: 36px;
    letter-spacing: -.04em;
}

.story-content p {
    color: var(--muted);
    line-height: 1.85;
}

.check-list {
    display: grid;
    gap: 12px;
    margin: 25px 0 0;
    padding: 0;
    list-style: none;
}

.check-list li {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    color: #445040;
    line-height: 1.55;
}

.check-list li::before {
    content: "✓";
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green-dark);
    font-size: 12px;
    font-weight: 900;
}

/* ============================================================
   NETWORK
   ============================================================ */

.network-section {
    padding: 110px 0;
    background: var(--dark);
    color: white;
}

.network-section .section-head p {
    color: #aeb7aa;
}

.network-image-wrapper {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    background: #0c100b;
    box-shadow: 0 35px 90px rgba(0,0,0,.45);
}

.network-image {
    width: 100%;
    min-height: 450px;
    display: block;
    object-fit: cover;
}

.network-caption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 25px;
    background: #151b13;
}

.network-caption strong {
    display: block;
    margin-bottom: 4px;
}

.network-caption span {
    color: #899486;
    font-size: 13px;
}

.newsky-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 11px 17px;
    border-radius: 10px;
    background: var(--green);
    color: #17200f;
    text-decoration: none;
    font-size: 13px;
    font-weight: 850;
    transition: transform .2s ease, box-shadow .2s ease;
}

.newsky-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(172,227,54,.18);
}

/* ============================================================
   DESTINATION CARDS
   ============================================================ */

.destination-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.destination-card {
    position: relative;
    min-height: 250px;
    overflow: hidden;
    border-radius: 18px;
    color: white;
    text-decoration: none;
    background: #111;
}

.destination-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--destination-image) center / cover no-repeat;
    transition: transform .5s ease;
}

.destination-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.05));
}

.destination-card:hover::before {
    transform: scale(1.08);
}

.destination-content {
    position: absolute;
    z-index: 2;
    left: 18px;
    right: 18px;
    bottom: 18px;
}

.destination-content small {
    color: var(--green);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.destination-content h3 {
    margin: 5px 0 3px;
    font-size: 22px;
}

.destination-content span {
    color: rgba(255,255,255,.72);
    font-size: 12px;
}

/* ============================================================
   FLEET
   ============================================================ */

.fleet-section {
    background: var(--light);
}

.fleet-tabs {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.fleet-tab {
    padding: 11px 18px;
    border: 1px solid #dfe5dc;
    border-radius: 999px;
    background: white;
    color: #273025;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, transform .2s ease;
}

.fleet-tab:hover {
    transform: translateY(-2px);
}

.fleet-tab.active {
    background: #17200f;
    color: white;
    border-color: #17200f;
}

.fleet-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.fcard {
    overflow: hidden;
    border: 1px solid #e0e6dc;
    border-radius: 18px;
    background: white;
    box-shadow: 0 10px 30px rgba(20,30,15,.05);
    transition: transform .35s ease, box-shadow .3s ease;
}

.fcard:hover {
    transform: translateY(-6px);
    box-shadow: 0 25px 60px rgba(20,30,15,.13);
}

.fcard-visual {
    position: relative;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle at center, #eef4e8, #f8faf6 65%);
}

.fcard-plane-img {
    width: 100%;
    height: 190px;
    object-fit: contain;
    display: block;
    transition: transform .45s ease;
}

.fcard:hover .fcard-plane-img {
    transform: scale(1.05);
}

.fcard-badge {
    position: absolute;
    z-index: 3;
    top: 13px;
    left: 13px;
    padding: 6px 9px;
    border-radius: 7px;
    background: rgba(23,32,15,.9);
    color: white;
    font-size: 9px;
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.fcard-info {
    padding: 18px;
}

.fcard-info h3 {
    margin: 0 0 4px;
    font-size: 19px;
}

.fcard-sub {
    margin: 0 0 15px;
    color: #71806d;
    font-size: 13px;
}

.fcard-specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 13px;
    border-top: 1px solid #edf0eb;
}

.spec-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
}

.spec-row span:first-child {
    color: #8a9485;
}

.spec-row span:last-child {
    color: #273025;
    font-weight: 750;
}

/* ============================================================
   FLIGHT FINDER
   ============================================================ */

.flight-finder {
    position: relative;
    overflow: hidden;
    padding: 70px 0;
    background:
        radial-gradient(circle at 10% 50%, rgba(172,227,54,.12), transparent 30%),
        #111711;
    color: white;
}

.flight-finder::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .08;
    background-image:
        linear-gradient(45deg, rgba(255,255,255,.2) 1px, transparent 1px);
    background-size: 40px 40px;
}

.finder-box {
    position: relative;
    z-index: 2;
    padding: 28px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(12px);
}

.finder-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field label {
    color: #9da898;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.field input,
.field select {
    width: 100%;
    min-height: 48px;
    padding: 0 13px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    outline: none;
    background: rgba(0,0,0,.22);
    color: white;
}

.field input::placeholder {
    color: #6e786b;
}

.field input:focus,
.field select:focus {
    border-color: var(--green);
}

.finder-result {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(172,227,54,.08);
    border: 1px solid rgba(172,227,54,.15);
    color: #cfe4b5;
}

.finder-result.show {
    display: block;
}

/* ============================================================
   NEWS
   ============================================================ */

.news-section {
    background: white;
}

.news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.news-card {
    overflow: hidden;
    border: 1px solid #e0e6dc;
    border-radius: 20px;
    background: white;
    box-shadow: 0 12px 35px rgba(20,30,15,.05);
    transition: transform .3s ease, box-shadow .3s ease;
}

.news-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 25px 60px rgba(20,30,15,.12);
}

.news-image {
    position: relative;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #17200f, #28371d);
    color: var(--green);
    font-size: 50px;
}

.news-image.has-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.news-content {
    padding: 23px;
}

.news-date {
    color: var(--green-dark);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.news-content h3 {
    margin: 9px 0 10px;
    font-size: 21px;
}

.news-content p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

.news-link {
    display: inline-flex;
    margin-top: 18px;
    color: var(--green-dark);
    text-decoration: none;
    font-size: 12px;
    font-weight: 850;
}

/* ============================================================
   OPERATIONS
   ============================================================ */

.operations-section {
    background: var(--light);
}

.map-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
}

.map-header h2 {
    margin: 8px 0 5px;
    font-size: 40px;
    letter-spacing: -.04em;
}

.map-header h2 span {
    color: var(--green-dark);
}

.map-header p {
    margin: 0;
    color: var(--muted);
}

.newsky-map {
    width: 100%;
    height: 650px;
    overflow: hidden;
    border: 1px solid #dfe5dc;
    border-radius: 20px;
    background: #101410;
    box-shadow: 0 20px 60px rgba(20,30,15,.12);
}

.newsky-map iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

/* ============================================================
   ROUTES BANNER
   ============================================================ */

.routes-banner {
    position: relative;
    overflow: hidden;
    padding: 95px 0;
    background:
        radial-gradient(circle at 80% 50%, rgba(172,227,54,.14), transparent 35%),
        #121811;
    color: white;
}

.routes-banner::after {
    content: "✈";
    position: absolute;
    right: 4%;
    bottom: -50px;
    color: rgba(255,255,255,.03);
    font-size: 250px;
    transform: rotate(-8deg);
}

.routes-banner-inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
}

.routes-banner h2 {
    margin: 8px 0 10px;
    font-size: clamp(35px, 5vw, 55px);
    letter-spacing: -.05em;
}

.routes-banner h2 span {
    color: var(--green);
}

.routes-banner p {
    max-width: 600px;
    margin: 0;
    color: #aeb7aa;
    line-height: 1.7;
}

/* ============================================================
   TEAM
   ============================================================ */

.team-section {
    background: var(--light);
}

.team-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.team-card {
    overflow: hidden;
    border: 1px solid #e0e6dc;
    border-radius: 18px;
    background: white;
    box-shadow: 0 10px 30px rgba(20,30,15,.05);
    transition: transform .3s ease, box-shadow .3s ease;
}

.team-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 22px 50px rgba(20,30,15,.12);
}

.team-photo {
    position: relative;
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #dce6d5, #f1f5ee);
    color: #71806d;
    font-size: 55px;
}

.team-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.team-info {
    padding: 20px;
}

.team-info h3 {
    margin: 5px 0;
}

.team-role {
    color: var(--green-dark);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.team-info p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

/* ============================================================
   GALLERY
   ============================================================ */

.gallery-section {
    background: white;
}

.gallery-grid {
    display: grid;
    grid-template-columns: 1.4fr .8fr .8fr;
    grid-auto-rows: 220px;
    gap: 14px;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 17px;
    background: #17200f;
}

.gallery-item.large {
    grid-row: span 2;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .5s ease;
}

.gallery-item:hover img {
    transform: scale(1.06);
}

.gallery-overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 22px;
    color: white;
    background: linear-gradient(transparent, rgba(0,0,0,.78));
}

.gallery-overlay strong {
    display: block;
    font-size: 16px;
}

.gallery-overlay span {
    color: rgba(255,255,255,.68);
    font-size: 11px;
}

/* ============================================================
   TESTIMONIALS
   ============================================================ */

.testimonial-section {
    background: var(--dark);
    color: white;
}

.testimonial-section .section-head p {
    color: #aeb7aa;
}

.testimonial-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.testimonial {
    padding: 28px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    background: rgba(255,255,255,.035);
}

.stars {
    color: var(--green);
    letter-spacing: 3px;
}

.testimonial p {
    color: #c0c8bb;
    line-height: 1.75;
}

.testimonial-author {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
}

.author-avatar {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--green);
    color: var(--black);
    font-weight: 900;
}

.author-info strong {
    display: block;
}

.author-info span {
    color: #7e897a;
    font-size: 11px;
}

/* ============================================================
   FAQ
   ============================================================ */

.faq-section {
    background: var(--light);
}

.faq {
    max-width: 850px;
    margin: 0 auto;
}

.faq-item {
    margin-bottom: 10px;
    border: 1px solid #dfe5dc;
    border-radius: 13px;
    background: white;
    overflow: hidden;
}

.faq-question {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 19px 20px;
    background: transparent;
    color: #273025;
    text-align: left;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.faq-icon {
    color: var(--green-dark);
    font-size: 20px;
    transition: transform .25s ease;
}

.faq-answer {
    display: none;
    padding: 0 20px 20px;
    color: var(--muted);
    line-height: 1.75;
    font-size: 13px;
}

.faq-item.open .faq-answer {
    display: block;
}

.faq-item.open .faq-icon {
    transform: rotate(45deg);
}

/* ============================================================
   COMMUNITY / SOCIAL
   ============================================================ */

.social-section {
    padding: 90px 0;
    background: #101410;
    color: white;
    text-align: center;
}

.social-section h2 {
    margin: 10px 0 15px;
    font-size: clamp(35px, 5vw, 55px);
    letter-spacing: -.05em;
}

.social-section h2 span {
    color: var(--green);
}

.social-section p {
    max-width: 650px;
    margin: 0 auto;
    color: #aeb7aa;
    line-height: 1.8;
}

.social-buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 28px;
}

.social-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 105px;
    padding: 9px 14px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 850;
    transition: transform .25s ease, box-shadow .25s ease;
}

.social-button img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    display: block;
}

.social-button:hover {
    transform: translateY(-3px);
}

.social-discord {
    background: #5865f2;
    color: white;
}

.social-tiktok {
    background: #000;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
}

/* ============================================================
   FINAL CTA
   ============================================================ */

.final-cta {
    position: relative;
    overflow: hidden;
    padding: 125px 0;
    text-align: center;
    background:
        radial-gradient(circle at center, rgba(172,227,54,.12), transparent 45%),
        #151b13;
    color: white;
}

.final-cta::before,
.final-cta::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border: 1px solid rgba(172,227,54,.10);
    border-radius: 50%;
}

.final-cta::before {
    left: -160px;
    top: -100px;
}

.final-cta::after {
    right: -160px;
    bottom: -100px;
}

.final-cta .container {
    position: relative;
    z-index: 2;
}

.final-cta h2 {
    margin: 10px 0 15px;
    font-size: clamp(40px, 6vw, 65px);
    letter-spacing: -.05em;
}

.final-cta h2 span {
    color: var(--green);
}

.final-cta p {
    max-width: 650px;
    margin: 0 auto;
    color: #aeb7aa;
    line-height: 1.8;
}

.final-cta .actions {
    justify-content: center;
}

/* ============================================================
   FOOTER
   ============================================================ */

footer {
    padding: 60px 0 25px;
    background: var(--black);
    color: white;
}

.foot-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 50px;
}

footer .brand {
    margin-bottom: 18px;
}

footer p {
    margin: 0;
    color: #8f988c;
    line-height: 1.7;
}

.foot-links {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 12px 28px;
    max-width: 600px;
    justify-content: end;
}

.foot-links a {
    color: #aeb7aa;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    transition: color .2s ease;
}

.foot-links a:hover {
    color: var(--green);
}

.footer-social {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.footer-social a {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    transition: transform .2s ease, background .2s ease;
}

.footer-social a:hover {
    transform: translateY(-3px);
    background: rgba(172,227,54,.12);
}

.footer-social img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.copy {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: #687267;
    font-size: 10px;
}

/* ============================================================
   BACK TO TOP
   ============================================================ */

.back-top {
    position: fixed;
    z-index: 900;
    right: 20px;
    bottom: 20px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(9,13,8,.82);
    color: var(--green);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    backdrop-filter: blur(12px);
    transition: opacity .25s ease, transform .25s ease;
}

.back-top.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}

/* ============================================================
   REVEAL ANIMATIONS
   ============================================================ */

.reveal {
    opacity: 0;
    transform: translateY(35px);
    transition: opacity .8s ease, transform .8s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

.reveal-left {
    opacity: 0;
    transform: translateX(-35px);
    transition: opacity .8s ease, transform .8s ease;
}

.reveal-left.visible {
    opacity: 1;
    transform: translateX(0);
}

.reveal-right {
    opacity: 0;
    transform: translateX(35px);
    transition: opacity .8s ease, transform .8s ease;
}

.reveal-right.visible {
    opacity: 1;
    transform: translateX(0);
}

/* ============================================================
   IMAGE PLACEHOLDER
   ============================================================ */

.image-slot {
    position: relative;
    min-height: 220px;
    overflow: hidden;
    border: 1px dashed rgba(110,156,30,.45);
    border-radius: 18px;
    background:
        linear-gradient(135deg, rgba(172,227,54,.12), rgba(23,32,15,.05));
}

.image-slot::before {
    content: "CUSTOM IMAGE";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(110,156,30,.65);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .12em;
}

.image-slot img {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    min-height: 220px;
    object-fit: cover;
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* ============================================================
   TABLET
   ============================================================ */

@media (max-width: 1200px) {
    .navlinks {
        gap: 13px;
    }

    .navlinks a {
        font-size: 11px;
    }

    .register {
        padding: 11px 14px;
        font-size: 11px;
    }

    .hero-content {
        transform: none;
    }

    .hero-quick {
        right: 3%;
    }

    .destination-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 1050px) {
    .navlinks {
        display: none;
    }

    .register {
        display: none;
    }

    .menu {
        display: block;
        margin-left: auto;
    }

    .hero-quick {
        display: none;
    }

    .story-grid {
        grid-template-columns: 1fr;
    }

    .story-image {
        min-height: 420px;
    }

    .team-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .finder-grid {
        grid-template-columns: 1fr 1fr;
    }

    .finder-grid .btn {
        width: 100%;
    }

    .foot-links {
        grid-template-columns: repeat(2, auto);
        justify-content: start;
    }
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 850px) {
    :root {
        --header-height: 82px;
    }

    .container {
        width: min(100% - 32px, 700px);
    }

    .desktop-only {
        display: none;
    }

    .mobile-only {
        display: block;
    }

    .hero {
        min-height: 700px;
    }

    .hero-content {
        padding: 80px 0;
    }

    .hero h1 {
        font-size: 50px;
    }

    .hero p {
        font-size: 16px;
    }

    .hero-plane {
        right: -160px;
        opacity: .35;
    }

    .hero-float {
        display: none;
    }

    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }

    .stat:nth-child(2) {
        border-right: none;
    }

    .experience-grid,
    .fleet-grid,
    .news-grid,
    .testimonial-grid {
        grid-template-columns: 1fr 1fr;
    }

    .team-grid {
        grid-template-columns: 1fr 1fr;
    }

    .home-section,
    .fleet-section,
    .network-section,
    .operations-section,
    .news-section,
    .team-section,
    .gallery-section,
    .faq-section,
    .testimonial-section {
        padding: 80px 0;
    }

    .gallery-grid {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 190px;
    }

    .gallery-item.large {
        grid-column: span 2;
        grid-row: span 1;
    }

    .newsky-map {
        height: 500px;
    }

    .map-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .newsky-button {
        width: 100%;
    }

    .routes-banner-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    .foot-top {
        flex-direction: column;
    }

    .copy {
        flex-direction: column;
    }
}

/* ============================================================
   SMALL PHONES
   ============================================================ */

@media (max-width: 520px) {
    .container {
        width: calc(100% - 28px);
    }

    .nav {
        min-height: 76px;
    }

    .brand-logo {
        width: 48px;
        height: 48px;
    }

    .brand-text {
        font-size: 11px;
    }

    .brand-text small {
        font-size: 8px;
    }

    .hero {
        min-height: 680px;
    }

    .hero h1 {
        font-size: 43px;
    }

    .hero-content {
        padding: 70px 0;
    }

    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }

    .stat {
        padding: 20px 8px;
    }

    .stat b {
        font-size: 24px;
    }

    .stat span {
        font-size: 9px;
    }

    .experience-grid,
    .fleet-grid,
    .news-grid,
    .team-grid,
    .testimonial-grid,
    .destination-grid {
        grid-template-columns: 1fr;
    }

    .story-image {
        min-height: 320px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: 220px;
    }

    .gallery-item.large {
        grid-column: auto;
    }

    .network-caption {
        flex-direction: column;
        align-items: flex-start;
    }

    .social-button {
        min-width: 100px;
    }

    .foot-links {
        grid-template-columns: 1fr 1fr;
        gap: 12px 25px;
    }

    .finder-grid {
        grid-template-columns: 1fr;
    }

    .newsky-map {
        height: 420px;
    }

    .back-top {
        right: 14px;
        bottom: 14px;
    }
}

/* =========================================================
   ECHO AIR GROUP — ADVANCED EXPERIENCE PACK
   ========================================================= */

:root {
    --eag-green: #ace336;
    --eag-green-dark: #6e9c1e;
    --eag-black: #090d08;
    --eag-dark: #101410;
    --eag-panel: #151b13;
    --eag-light: #f5f7f3;
    --eag-muted: #687267;
    --eag-border: rgba(255,255,255,.10);
    --eag-radius: 22px;
    --eag-shadow: 0 25px 70px rgba(0,0,0,.18);
}

/* ---- Background image system ---- */

.image-hero {
    background:
        linear-gradient(90deg, rgba(5,8,5,.95), rgba(5,8,5,.70), rgba(5,8,5,.30)),
        url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
}

.photo-placeholder {
    position: relative;
    overflow: hidden;
    min-height: 260px;
    border-radius: var(--eag-radius);
    background:
        linear-gradient(135deg, rgba(172,227,54,.12), rgba(0,0,0,.15)),
        #111711;
}

.photo-placeholder::after {
    content: "ADD YOUR OWN IMAGE";
    position: absolute;
    inset: auto 18px 18px 18px;
    padding: 10px 14px;
    border: 1px dashed rgba(255,255,255,.25);
    border-radius: 10px;
    color: rgba(255,255,255,.65);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-align: center;
}

/* ---- Scroll progress ---- */

.scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 3px;
    z-index: 3000;
    background: var(--eag-green);
    box-shadow: 0 0 14px rgba(172,227,54,.75);
}

/* ---- Announcement bar ---- */

.announcement-bar {
    background: #151b13;
    color: #dfe8d9;
    border-bottom: 1px solid rgba(172,227,54,.12);
    overflow: hidden;
}

.announcement-inner {
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 700;
}

.announcement-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--eag-green);
    box-shadow: 0 0 12px var(--eag-green);
}

/* ---- Hero upgrades ---- */

.hero-enhanced {
    isolation: isolate;
}

.hero-noise {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: .055;
    background-image:
        radial-gradient(rgba(255,255,255,.8) .5px, transparent .5px);
    background-size: 5px 5px;
}

.hero-sun {
    position: absolute;
    width: 620px;
    height: 620px;
    right: -220px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(172,227,54,.18), transparent 66%);
    filter: blur(10px);
    z-index: 1;
    pointer-events: none;
}

.hero-plane-image {
    position: absolute;
    z-index: 2;
    right: -4%;
    bottom: 4%;
    width: min(68vw, 1050px);
    max-height: 600px;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 30px 45px rgba(0,0,0,.48));
    transform: rotate(-4deg);
    animation: planeDrift 7s ease-in-out infinite;
    pointer-events: none;
}

@keyframes planeDrift {
    0%, 100% { transform: translate3d(0,0,0) rotate(-4deg); }
    50% { transform: translate3d(-12px,-12px,0) rotate(-3deg); }
}

.hero-route-line {
    position: absolute;
    z-index: 2;
    right: 4%;
    top: 24%;
    width: 38%;
    height: 28%;
    border-top: 2px dashed rgba(172,227,54,.38);
    border-radius: 50%;
    transform: rotate(-10deg);
    pointer-events: none;
}

.hero-route-line::after {
    content: "✈";
    position: absolute;
    right: 12%;
    top: -19px;
    color: var(--eag-green);
    font-size: 18px;
    transform: rotate(10deg);
    animation: routePlane 5s linear infinite;
}

@keyframes routePlane {
    0% { right: 5%; opacity: 0; }
    15% { opacity: 1; }
    80% { opacity: 1; }
    100% { right: 90%; opacity: 0; }
}

.hero-scroll {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .16em;
}

.hero-scroll-line {
    width: 1px;
    height: 35px;
    background: linear-gradient(var(--eag-green), transparent);
    animation: scrollPulse 1.7s ease-in-out infinite;
}

@keyframes scrollPulse {
    0%,100% { opacity: .35; transform: scaleY(.65); transform-origin: top; }
    50% { opacity: 1; transform: scaleY(1); }
}

/* ---- Section ornaments ---- */

.section-line {
    width: 70px;
    height: 3px;
    margin-top: 20px;
    border-radius: 99px;
    background: var(--eag-green);
}

.section-head.center .section-line {
    margin-left: auto;
    margin-right: auto;
}

.section-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.section-kicker::before {
    content: "";
    width: 24px;
    height: 2px;
    background: var(--eag-green);
}

/* ---- Feature strip ---- */

.feature-strip {
    position: relative;
    padding: 0 0 100px;
    background: var(--eag-light);
}

.feature-strip-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.feature-mini {
    position: relative;
    min-height: 150px;
    padding: 25px;
    overflow: hidden;
    border-radius: 18px;
    background: #fff;
    border: 1px solid #e1e7dd;
    box-shadow: 0 12px 35px rgba(20,30,15,.045);
    transition: transform .3s ease, box-shadow .3s ease;
}

.feature-mini:hover {
    transform: translateY(-6px);
    box-shadow: 0 25px 55px rgba(20,30,15,.10);
}

.feature-mini-number {
    position: absolute;
    right: 15px;
    bottom: -20px;
    color: rgba(110,156,30,.08);
    font-size: 100px;
    font-weight: 900;
}

.feature-mini-icon {
    font-size: 25px;
    margin-bottom: 18px;
}

.feature-mini h3 {
    margin: 0 0 7px;
    font-size: 17px;
}

.feature-mini p {
    margin: 0;
    color: var(--eag-muted);
    font-size: 13px;
    line-height: 1.6;
}

/* ---- Destination explorer ---- */

.destinations-section {
    padding: 115px 0;
    background: #fff;
}

.destination-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.destination-card {
    position: relative;
    min-height: 360px;
    overflow: hidden;
    border-radius: 22px;
    background: #111;
    color: white;
    box-shadow: var(--eag-shadow);
    isolation: isolate;
}

.destination-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    transition: transform .7s ease;
}

.destination-card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.84));
}

.destination-card:hover::before {
    transform: scale(1.08);
}

.destination-card:nth-child(1)::before {
    background-image: url("https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=900&q=80");
}

.destination-card:nth-child(2)::before {
    background-image: url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80");
}

.destination-card:nth-child(3)::before {
    background-image: url("https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=900&q=80");
}

.destination-card:nth-child(4)::before {
    background-image: url("https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=900&q=80");
}

.destination-content {
    position: absolute;
    inset: auto 20px 20px 20px;
}

.destination-code {
    display: inline-flex;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(172,227,54,.92);
    color: #17200f;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .08em;
}

.destination-content h3 {
    margin: 10px 0 4px;
    font-size: 25px;
}

.destination-content p {
    margin: 0;
    color: rgba(255,255,255,.75);
    font-size: 13px;
}

.destination-arrow {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    background: rgba(0,0,0,.22);
}

/* ---- Route finder ---- */

.route-finder-section {
    padding: 105px 0;
    background:
        radial-gradient(circle at 15% 20%, rgba(172,227,54,.08), transparent 30%),
        #101410;
    color: white;
}

.route-finder {
    padding: 28px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px;
    background: rgba(255,255,255,.035);
    backdrop-filter: blur(12px);
}

.route-search-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
}

.route-field label {
    display: block;
    margin-bottom: 7px;
    color: #9aa596;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.route-field input,
.route-field select {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,.06);
    color: white;
    font: inherit;
}

.route-field select option {
    background: #151b13;
    color: white;
}

.route-results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 18px;
}

.route-result {
    padding: 18px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px;
    background: rgba(255,255,255,.035);
}

.route-result.hidden {
    display: none;
}

.route-codes {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--eag-green);
    font-size: 18px;
    font-weight: 900;
}

.route-codes span {
    color: #8f988c;
    font-size: 12px;
}

.route-result p {
    margin: 7px 0 0;
    color: #9aa596;
    font-size: 12px;
}

/* ---- Operations status ---- */

.ops-status-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 22px;
}

.ops-status-card {
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #dfe5dc;
    background: #fff;
}

.ops-status-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status-live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #638d1b;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
}

.status-live::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7fbe21;
    box-shadow: 0 0 10px rgba(127,190,33,.7);
}

.ops-status-card strong {
    display: block;
    margin-top: 12px;
    font-size: 25px;
}

.ops-status-card span {
    color: #7c8779;
    font-size: 11px;
}

/* ---- Gallery ---- */

.gallery-section {
    padding: 110px 0;
    background: #f5f7f3;
}

.gallery-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    grid-auto-rows: 210px;
    gap: 14px;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    cursor: pointer;
    background: #182017;
}

.gallery-item:first-child {
    grid-row: span 2;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .6s ease, filter .6s ease;
}

.gallery-item::after {
    content: "VIEW PHOTO";
    position: absolute;
    left: 15px;
    bottom: 15px;
    padding: 7px 10px;
    border-radius: 7px;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .1em;
    opacity: 0;
    transform: translateY(6px);
    transition: .25s ease;
}

.gallery-item:hover img {
    transform: scale(1.07);
    filter: brightness(.78);
}

.gallery-item:hover::after {
    opacity: 1;
    transform: translateY(0);
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 4000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: rgba(0,0,0,.88);
    backdrop-filter: blur(10px);
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: min(1200px, 94vw);
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 30px 100px rgba(0,0,0,.65);
}

.lightbox-close {
    position: fixed;
    top: 22px;
    right: 22px;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 24px;
    cursor: pointer;
}

/* ---- Testimonials ---- */

.testimonials-section {
    padding: 110px 0;
    background: #fff;
}

.testimonial-shell {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
}

.testimonial {
    display: none;
    padding: 50px;
    border-radius: 25px;
    background: #151b13;
    color: white;
    box-shadow: var(--eag-shadow);
    text-align: center;
}

.testimonial.active {
    display: block;
    animation: testimonialIn .45s ease;
}

@keyframes testimonialIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.testimonial-stars {
    color: var(--eag-green);
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.testimonial blockquote {
    max-width: 720px;
    margin: 0 auto 22px;
    font-size: clamp(20px, 3vw, 30px);
    line-height: 1.45;
    letter-spacing: -.02em;
}

.testimonial-author {
    color: #9da795;
    font-size: 13px;
}

.testimonial-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
}

.testimonial-dot {
    width: 8px;
    height: 8px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: #d5ddd0;
    cursor: pointer;
}

.testimonial-dot.active {
    background: var(--eag-green-dark);
}

/* ---- FAQ ---- */

.faq-section {
    padding: 110px 0;
    background: #f5f7f3;
}

.faq-list {
    max-width: 900px;
    margin: 0 auto;
}

.faq-item {
    margin-bottom: 10px;
    overflow: hidden;
    border: 1px solid #dfe5dc;
    border-radius: 14px;
    background: white;
}

.faq-question {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 19px 21px;
    border: 0;
    background: transparent;
    color: #17200f;
    font: inherit;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
}

.faq-question span:last-child {
    color: var(--eag-green-dark);
    font-size: 20px;
    transition: transform .25s ease;
}

.faq-item.open .faq-question span:last-child {
    transform: rotate(45deg);
}

.faq-answer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
}

.faq-answer > div {
    overflow: hidden;
}

.faq-item.open .faq-answer {
    grid-template-rows: 1fr;
}

.faq-answer p {
    margin: 0;
    padding: 0 21px 20px;
    color: #687267;
    line-height: 1.7;
    font-size: 14px;
}

/* ---- Newsletter ---- */

.newsletter-section {
    padding: 90px 0;
    background: #101410;
    color: white;
}

.newsletter-box {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 50px;
    align-items: center;
    padding: 45px;
    border: 1px solid rgba(172,227,54,.14);
    border-radius: 25px;
    background:
        radial-gradient(circle at 100% 0, rgba(172,227,54,.10), transparent 40%),
        #151b13;
}

.newsletter-box h2 {
    margin: 7px 0 10px;
    font-size: clamp(32px, 4vw, 50px);
}

.newsletter-box p {
    margin: 0;
    max-width: 600px;
    color: #9aa596;
    line-height: 1.7;
}

.newsletter-form {
    display: flex;
    gap: 8px;
}

.newsletter-form input {
    min-width: 0;
    flex: 1;
    padding: 14px 15px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,.06);
    color: white;
}

.newsletter-form button {
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    background: var(--eag-green);
    color: #17200f;
    font-weight: 900;
    cursor: pointer;
}

/* ---- Back to top ---- */

.back-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 2500;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    background: #151b13;
    color: var(--eag-green);
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: .25s ease;
}

.back-top.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}

/* ---- Toast ---- */

.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 5000;
    transform: translate(-50%, 20px);
    max-width: calc(100% - 30px);
    padding: 13px 18px;
    border: 1px solid rgba(172,227,54,.25);
    border-radius: 10px;
    background: #151b13;
    color: white;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: .3s ease;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ---- Reduced motion ---- */

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* ---- Advanced responsive layout ---- */

@media (max-width: 1000px) {
    .feature-strip-grid,
    .destination-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .route-search-grid {
        grid-template-columns: 1fr 1fr;
    }

    .route-results,
    .ops-status-grid {
        grid-template-columns: 1fr 1fr;
    }

    .gallery-grid {
        grid-template-columns: 1fr 1fr;
    }

    .gallery-item:first-child {
        grid-row: span 1;
    }

    .newsletter-box {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 700px) {
    .announcement-inner {
        padding: 8px 0;
        text-align: center;
    }

    .hero-plane-image {
        width: 850px;
        max-width: none;
        right: -430px;
        opacity: .35;
    }

    .hero-route-line {
        display: none;
    }

    .feature-strip-grid,
    .destination-grid,
    .route-results,
    .ops-status-grid,
    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .gallery-grid {
        grid-auto-rows: 240px;
    }

    .route-search-grid {
        grid-template-columns: 1fr;
    }

    .testimonial {
        padding: 32px 22px;
    }

    .newsletter-box {
        padding: 28px 22px;
    }

    .newsletter-form {
        flex-direction: column;
    }

    .newsletter-form button {
        width: 100%;
    }
}


.navlinks a.current-page {
    color: #ace336;

<script src="script.js"></script>

<script>
/* ============================================================
   MOBILE NAVIGATION
   ============================================================ */

function toggleMenu() {
    const mobileNav = document.getElementById("mobileNav");
    const menuButton = document.getElementById("menuButton");

    if (!mobileNav || !menuButton) {
        return;
    }

    const isOpen = mobileNav.classList.toggle("open");

    menuButton.setAttribute(
        "aria-expanded",
        String(isOpen)
    );

    menuButton.textContent = isOpen ? "×" : "☰";

    document.body.classList.toggle(
        "menu-open",
        isOpen
    );
}

/* ============================================================
   CLOSE MOBILE MENU AFTER LINK CLICK
   ============================================================ */

document
    .querySelectorAll("#mobileNav a")
    .forEach(link => {

        link.addEventListener(
            "click",
            () => {

                const mobileNav =
                    document.getElementById("mobileNav");

                const menuButton =
                    document.getElementById("menuButton");

                if (mobileNav) {
                    mobileNav.classList.remove("open");
                }

                if (menuButton) {
                    menuButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    menuButton.textContent = "☰";
                }

                document.body.classList.remove(
                    "menu-open"
                );
            }
        );
    });

/* ============================================================
   FLEET FILTER
   ============================================================ */

function filterFleet(type, button) {

    const cards =
        document.querySelectorAll(".fcard");

    const tabs =
        document.querySelectorAll(".fleet-tab");

    tabs.forEach(tab => {
        tab.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }

    cards.forEach(card => {

        const matches =
            type === "all" ||
            card.dataset.type === type;

        card.classList.toggle(
            "hidden",
            !matches
        );
    });
}

/* ============================================================
   SCROLL REVEAL
   ============================================================ */

const revealElements =
    document.querySelectorAll(
        ".reveal, .reveal-left, .reveal-right"
    );

const revealObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add(
                        "visible"
                    );

                    revealObserver.unobserve(
                        entry.target
                    );
                }
            });
        },
        {
            threshold: .10
        }
    );

revealElements.forEach(element => {
    revealObserver.observe(element);
});

/* ============================================================
   HEADER SCROLL EFFECT
   ============================================================ */

const siteHeader =
    document.getElementById("siteHeader");

const backTop =
    document.getElementById("backTop");

let previousScrollY =
    window.scrollY;

function updateHeader() {

    if (!siteHeader) {
        return;
    }

    const currentScrollY =
        window.scrollY;

    if (currentScrollY > 10) {

        siteHeader.classList.add(
            "scrolled"
        );

    } else {

        siteHeader.classList.remove(
            "scrolled"
        );
    }

    if (
        currentScrollY > previousScrollY &&
        currentScrollY > 500
    ) {

        siteHeader.classList.add(
            "hide-on-scroll"
        );

    } else {

        siteHeader.classList.remove(
            "hide-on-scroll"
        );
    }

    if (backTop) {

        backTop.classList.toggle(
            "visible",
            currentScrollY > 600
        );
    }

    previousScrollY =
        currentScrollY;
}

window.addEventListener(
    "scroll",
    updateHeader,
    {
        passive: true
    }
);

updateHeader();

/* ============================================================
   COUNTER ANIMATION
   ============================================================ */

const counters =
    document.querySelectorAll(
        ".counter"
    );

let countersStarted =
    false;

function animateCounters() {

    if (countersStarted) {
        return;
    }

    countersStarted = true;

    counters.forEach(counter => {

        const target =
            Number(
                counter.dataset.target
            );

        const duration =
            1300;

        const start =
            performance.now();

        function updateCounter(now) {

            const progress =
                Math.min(
                    (now - start) /
                    duration,
                    1
                );

            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );

            const value =
                Math.floor(
                    eased * target
                );

            counter.textContent =
                value + (
                    target >= 100
                        ? "+"
                        : "+"
                );

            if (progress < 1) {

                requestAnimationFrame(
                    updateCounter
                );

            } else {

                counter.textContent =
                    target + "+";
            }
        }

        requestAnimationFrame(
            updateCounter
        );
    });
}

const statsElement =
    document.querySelector(".stats");

if (statsElement) {

    const statsObserver =
        new IntersectionObserver(
            entries => {

                if (
                    entries[0].isIntersecting
                ) {

                    animateCounters();

                    statsObserver.disconnect();
                }
            },
            {
                threshold: .4
            }
        );

    statsObserver.observe(
        statsElement
    );
}

/* ============================================================
   FAQ ACCORDION
   ============================================================ */

function toggleFaq(button) {

    const item =
        button.closest(".faq-item");

    if (!item) {
        return;
    }

    const allItems =
        document.querySelectorAll(
            ".faq-item"
        );

    allItems.forEach(otherItem => {

        if (otherItem !== item) {

            otherItem.classList.remove(
                "open"
            );
        }
    });

    item.classList.toggle(
        "open"
    );
}

/* ============================================================
   FLIGHT FINDER
   ============================================================ */

function findFlight() {

    const from =
        document
            .getElementById(
                "fromAirport"
            )
            .value
            .trim()
            .toUpperCase();

    const to =
        document
            .getElementById(
                "toAirport"
            )
            .value
            .trim()
            .toUpperCase();

    const aircraft =
        document
            .getElementById(
                "flightAircraft"
            )
            .value;

    const result =
        document
            .getElementById(
                "finderResult"
            );

    if (!from || !to) {

        result.textContent =
            "Please enter both a departure and destination airport.";

        result.classList.add(
            "show"
        );

        return;
    }

    if (from === to) {

        result.textContent =
            "Departure and destination cannot be the same airport.";

        result.classList.add(
            "show"
        );

        return;
    }

    result.innerHTML =
        "<strong>Flight idea ready:</strong> " +
        "ECV " +
        from +
        " → " +
        to +
        " · " +
        aircraft +
        ". " +
        "Check the Routes page for the current network.";

    result.classList.add(
        "show"
    );
}

/* ============================================================
   ENTER KEY FOR FLIGHT FINDER
   ============================================================ */

document
    .querySelectorAll(
        "#fromAirport, #toAirport"
    )
    .forEach(input => {

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    findFlight();
                }
            }
        );
    });

/* ============================================================
   SMOOTH INTERNAL LINKS
   ============================================================ */

document
    .querySelectorAll(
        'a[href^="#"]'
    )
    .forEach(link => {

        link.addEventListener(
            "click",
            event => {

                const targetId =
                    link
                        .getAttribute(
                            "href"
                        );

                if (
                    !targetId ||
                    targetId === "#"
                ) {
                    return;
                }

                const target =
                    document.querySelector(
                        targetId
                    );

                if (!target) {
                    return;
                }

                event.preventDefault();

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        );
    });

/* ============================================================
   IMAGE ERROR FALLBACK
   ============================================================ */

document
    .querySelectorAll("img")
    .forEach(image => {

        image.addEventListener(
            "error",
            () => {

                image.style.display =
                    "none";

                const parent =
                    image.parentElement;

                if (
                    parent &&
                    parent.classList.contains(
                        "fcard-visual"
                    )
                ) {

                    parent.style.background =
                        "linear-gradient(135deg,#eef6df,#f8faf6)";

                    parent.insertAdjacentHTML(
                        "beforeend",
                        '<span style="color:#6e9c1e;font-weight:800;font-size:13px;">Aircraft image unavailable</span>'
                    );
                }
            },
            {
                once: true
            }
        );
    });

/* ============================================================
   CURRENT YEAR
   ============================================================ */

document
    .querySelectorAll(
        "[data-current-year]"
    )
    .forEach(element => {

        element.textContent =
            new Date()
                .getFullYear();

/* ============================================================
   PARALLAX HERO
   ============================================================ */

const hero =
    document.querySelector(
        ".hero"
    );

const heroBackground =
    document.querySelector(
        ".hero-background-image"
    );

if (
    hero &&
    heroBackground &&
    !window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches
) {

    window.addEventListener(
        "scroll",
        () => {

            const rect =
                hero.getBoundingClientRect();

            const progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        -rect.top /
                        Math.max(
                            hero.offsetHeight,
                            1
                        )
                    )
                );

            heroBackground.style.transform =
                "scale(1.04) translateY(" +
                progress * 35 +
                "px)";
        },
        {
            passive: true
        }
    );
}

/* ============================================================
   ACTIVE NAVIGATION
   ============================================================ */

const sections =
    document.querySelectorAll(
        "main section[id]"
    );

const desktopLinks =
    document.querySelectorAll(
        ".navlinks a"
    );

const sectionObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (!entry.isIntersecting) {
                    return;
                }

                const id =
                    entry.target.id;

                desktopLinks.forEach(link => {

                    link.classList.remove(
                        "active"
                    );

                    if (
                        link.getAttribute(
                            "href"
                        ) === "#" + id
                    ) {

                        link.classList.add(
                            "active"
                        );
                    }
                });
            });
        },
        {
            rootMargin:
                "-35% 0px -55% 0px"
        }
    );

sections.forEach(section => {

    sectionObserver.observe(
        section
    );
});
