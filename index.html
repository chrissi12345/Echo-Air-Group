/* =========================================================
   ADVANCED PAGE INTERACTIONS
   ========================================================= */

/* Scroll progress + back-to-top */
const progressBar = document.getElementById("scrollProgress");
const backTop = document.getElementById("backTop");

function updateAdvancedScrollUI() {
    const scrollTop = window.scrollY;
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const progress = scrollable > 0 ? (scrollTop / scrollable) * 100 : 0;

    if (progressBar) {
        progressBar.style.width = progress + "%";
    }

    if (backTop) {
        backTop.classList.toggle("visible", scrollTop > 500);
    }
}

window.addEventListener("scroll", updateAdvancedScrollUI, { passive: true });
updateAdvancedScrollUI();


/* Route finder */
function searchRoutes() {
    const from = (document.getElementById("routeFrom")?.value || "").trim().toUpperCase();
    const to = (document.getElementById("routeTo")?.value || "").trim().toUpperCase();
    const type = document.getElementById("routeType")?.value || "all";
    const results = document.querySelectorAll(".route-result");

    let matches = 0;

    results.forEach(result => {
        const resultFrom = result.dataset.from || "";
        const resultTo = result.dataset.to || "";
        const resultType = result.dataset.type || "";

        const fromOK = !from || resultFrom === from;
        const toOK = !to || resultTo === to;
        const typeOK = type === "all" || resultType === type;
        const visible = fromOK && toOK && typeOK;

        result.classList.toggle("hidden", !visible);

        if (visible) matches++;
    });

    showToast(
        matches
            ? matches + " route" + (matches === 1 ? "" : "s") + " found."
            : "No matching example routes found."
    );
}


/* Gallery lightbox */
function openLightbox(item) {
    const image = item.querySelector("img");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    if (!image || !lightbox || !lightboxImage) return;

    lightboxImage.src = image.src;
    lightboxImage.alt = image.alt || "Echo Air Group flight photo";
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeLightbox(event) {
    if (event && event.target && event.target.id === "lightboxImage") return;

    const lightbox = document.getElementById("lightbox");

    if (lightbox) {
        lightbox.classList.remove("open");
    }

    document.body.style.overflow = "";
}

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeLightbox();
    }
});


/* Testimonials */
let testimonialIndex = 0;

function showTestimonial(index) {
    const testimonials = document.querySelectorAll(".testimonial");
    const dots = document.querySelectorAll(".testimonial-dot");

    if (!testimonials.length) return;

    testimonialIndex = index;

    testimonials.forEach((item, i) => {
        item.classList.toggle("active", i === index);
    });

    dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
    });
}

setInterval(() => {
    const testimonials = document.querySelectorAll(".testimonial");

    if (testimonials.length > 1) {
        testimonialIndex = (testimonialIndex + 1) % testimonials.length;
        showTestimonial(testimonialIndex);
    }
}, 7000);


/* FAQ */
function toggleFaq(button) {
    const item = button.closest(".faq-item");

    if (!item) return;

    document.querySelectorAll(".faq-item.open").forEach(openItem => {
        if (openItem !== item) {
            openItem.classList.remove("open");
        }
    });

    item.classList.toggle("open");
}


/* Newsletter demo */
function fakeNewsletter(event) {
    event.preventDefault();

    const email = document.getElementById("newsletterEmail");

    if (!email || !email.value.trim()) return;

    showToast("Thanks! Your newsletter signup is ready to connect to your email service.");
    email.value = "";
}


/* Toast notifications */
let toastTimer;

function showToast(message) {
    const toast = document.getElementById("toast");

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 3200);
}


/* Simulated live counters */
function updateLiveNumbers() {
    const flights = document.getElementById("liveFlights");
    const pilots = document.getElementById("onlinePilots");

    if (flights) {
        const value = 10 + Math.floor(Math.random() * 7);
        flights.textContent = value;
    }

    if (pilots) {
        const value = 23 + Math.floor(Math.random() * 10);
        pilots.textContent = value;
    }
}

setInterval(updateLiveNumbers, 8000);


/* Keyboard-friendly route search */
["routeFrom", "routeTo"].forEach(id => {
    const input = document.getElementById(id);

    if (input) {
        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                searchRoutes();
            }
        });
    }
});


/* Image error fallback */
document.querySelectorAll("img").forEach(img => {
    img.addEventListener("error", () => {
        img.style.opacity = ".35";
        img.style.filter = "grayscale(1)";
    });
});


/* Add active navigation state */
const currentPage = location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".navlinks a, .mobileNav a, .foot-links a").forEach(link => {
    const href = link.getAttribute("href");

    if (!href || href.startsWith("#") || href.startsWith("http")) return;

    const cleanHref = href.split("#")[0];

    if (cleanHref === currentPage) {
        link.classList.add("current-page");
    }
});


/* Smooth anchor links */
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener("click", event => {
        const targetID = anchor.getAttribute("href");

        if (!targetID || targetID === "#") return;

        const target = document.querySelector(targetID);

        if (!target) return;

        event.preventDefault();

        target.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    });
});


/* Intersection observer with staggered cards */
const advancedRevealObserver = new IntersectionObserver(
    entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const children = entry.target.querySelectorAll(
                ".feature-mini, .destination-card, .route-result, .ops-status-card, .gallery-item, .faq-item"
            );

            children.forEach((child, index) => {
                child.style.transitionDelay = Math.min(index * 70, 420) + "ms";
                child.classList.add("visible");
            });

            advancedRevealObserver.unobserve(entry.target);
        });
    },
    { threshold: .08 }
);

document.querySelectorAll(
    ".feature-strip, .destinations-section, .route-finder-section, .operations-section, .gallery-section, .faq-section"
).forEach(section => {
    advancedRevealObserver.observe(section);
});


/* Parallax effect for hero */
const heroSection = document.querySelector(".hero-enhanced");
const heroPlane = document.querySelector(".hero-plane-image");

window.addEventListener("scroll", () => {
    if (!heroSection || !heroPlane) return;

    const rect = heroSection.getBoundingClientRect();

    if (rect.bottom < 0 || rect.top > window.innerHeight) return;

    const offset = Math.max(-30, Math.min(30, rect.top * -0.035));

    heroPlane.style.marginTop = offset + "px";
}, { passive: true });


/* Make external links safer */
document.querySelectorAll('a[target="_blank"]').forEach(link => {
    link.setAttribute("rel", "noopener noreferrer");
});
