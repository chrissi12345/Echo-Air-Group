name: Fix server.js routes section

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '.github/workflows/fix-server-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != '[automated] Fix server.js routes section'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair server.js routes section
        shell: python
        run: |
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          # Remove the stray duplicated code that appears immediately
          # after the first normalizeNewSkySchedule() function.
          start_marker = "    // --------------------------------------------------------\n    // Normal array response"
          end_marker = "// ============================================================\n// SCHEDULE VALUE HELPER"

          start = text.find(start_marker)
          end = text.find(end_marker, start) if start != -1 else -1

          if start != -1 and end != -1:
              text = text[:start] + text[end:]

          # Keep the direct NewSky schedules /api/routes endpoint.
          # Remove the later PostgreSQL duplicate endpoint so there is
          # only one GET /api/routes route and it uses the actual NewSky
          # schedules returned by the airline account.
          routes_marker = "// API: ALL ECHO AIR GROUP ROUTES"
          flights_marker = "// ROUTES FROM NEWSKY FLIGHTS"
          pg_start = text.find(routes_marker, text.find(flights_marker))
          user_map_marker = "// USER MAP"
          pg_end = text.find(user_map_marker, pg_start) if pg_start != -1 else -1

          if pg_start != -1 and pg_end != -1:
              text = text[:pg_start] + "// PostgreSQL route endpoint intentionally removed. Routes use NewSky schedules above.\n\n" + text[pg_end:]

          path.write_text(text, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check server.js

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m '[automated] Fix server.js routes section'
          git push
