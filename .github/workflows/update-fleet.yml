name: Update Echo Air Group fleet

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-fleet:
    if: ${{ !contains(github.event.head_commit.message, 'Update Echo Air Group fleet') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update fleet sections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_container(text, class_name, new_inner):
              pattern = re.compile(r'<div\\b[^>]*class=["\\\'][^"\\\']*\\b' + re.escape(class_name) + r'\\b[^"\\\']*["\\\'][^>]*>', re.I)
              m = pattern.search(text)
              if not m:
                  raise RuntimeError(f'Could not find .{class_name}')
              start = m.end()
              pos = start
              depth = 1
              token = re.compile(r'<div\\b[^>]*>|</div\\s*>', re.I)
              while True:
                  t = token.search(text, pos)
                  if not t:
                      raise RuntimeError(f'Could not find closing div for .{class_name}')
                  if t.group(0).lower().startswith('</'):
                      depth -= 1
                      if depth == 0:
                          end = t.start()
                          return text[:start] + '\\n' + new_inner.strip() + '\\n' + text[end:]
                  else:
                      depth += 1
                  pos = t.end()

          def card(name, role, image, range_nm, seats, cruise, engines, data_type=None):
              data = f' data-type="{data_type}"' if data_type else ''
              return f'''            <article class="fcard"{data}>
                <div class="fcard-visual">
                    <div class="fcard-badge">{role}</div>
                    <img class="fcard-plane-img" src="{image}" alt="{name}" loading="lazy">
                </div>
                <div class="fcard-info">
                    <h3>{name}</h3>
                    <p class="fcard-sub">{role}</p>
                    <div class="fcard-specs">
                        <div class="spec-row"><span>Range</span><span>{range_nm}</span></div>
                        <div class="spec-row"><span>Seats</span><span>{seats}</span></div>
                        <div class="spec-row"><span>Cruise</span><span>{cruise}</span></div>
                        <div class="spec-row"><span>Engines</span><span>{engines}</span></div>
                    </div>
                </div>
            </article>'''

          A319='https://images.aircharterservice.com/global/aircraft-guide/group-charter/airbus-a319-1.jpg'
          A320='https://images.aircharterservice.com/global/aircraft-guide/group-charter/airbus-a320-1.jpg'
          A320NEO='https://www.aircraft.airbus.com/sites/g/files/jlcbta126/files/styles/w1200h675/public/2025-10/Aircraft.Airbus%20Figma%20Images%20V2_A320neo.png?h=eb58b4d6&itok=m1AYlns4'
          A321NEO='https://www.aircraft.airbus.com/sites/g/files/jlcbta126/files/styles/w1200h675/public/2025-10/Aircraft.Airbus%20Figma%20Images%20V2_A321neo_0.png?h=eb58b4d6&itok=gAu23q7j'
          B737_700='https://www.flugzeuginfo.net/acimages/7377bbj_kp.jpg'
          B737_800='https://aeroaffaires.fr/wp-content/uploads/2024/05/ascend-airways-boeing-737-800.jpg'
          B737_MAX='https://cf-images.us-east-1.prod.boltdns.net/v1/static/800000612001/dcfb0a2e-49be-40c3-8d69-2438a13ea1db/54874523-f888-40e7-94b3-ffcf9a49a8e7/1920x1080/match/image.jpg'
          B787='https://commons.wikimedia.org/wiki/Special:FilePath/Boeing_787-8_Dreamliner.jpg'
          B777_300='https://commons.wikimedia.org/wiki/Special:FilePath/Boeing_777-300ER.jpg'
          A380='https://commons.wikimedia.org/wiki/Special:FilePath/Airbus_A380-800.jpg'
          B777_200='https://commons.wikimedia.org/wiki/Special:FilePath/Boeing_777-200.jpg'
          B777_200LR='https://commons.wikimedia.org/wiki/Special:FilePath/Boeing_777-200LR.jpg'
          A350='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSq0_OfYatAxrbUJTTgRbHrSvDvDcn8vWbMzmhJGnImA&s=10'

          index_cards = [
              card('Airbus A320', 'Narrow Body', A320, '3,300 nm', '180 pax', 'Mach 0.78', 'CFM56 / V2500', 'narrow'),
              card('Airbus A321neo', 'Narrow Body', A321NEO, '4,000 nm', '220 pax', 'Mach 0.78', 'LEAP-1A', 'narrow'),
              card('Airbus A319', 'Narrow Body', A319, '3,700 nm', '144 pax', 'Mach 0.78', 'CFM56 / V2500', 'narrow'),
              card('Boeing 737-800', 'Narrow Body', B737_800, '2,935 nm', '174 pax', 'Mach 0.79', 'CFM56-7B', 'narrow'),
              card('Boeing 737 MAX 8', 'Narrow Body', B737_MAX, '3,550 nm', '178 pax', 'Mach 0.79', 'LEAP-1B', 'narrow'),
              card('Boeing 787-8', 'Wide Body', B787, '7,355 nm', '242 pax', 'Mach 0.85', 'GEnx-1B / Trent 1000', 'wide'),
              card('Boeing 777-300ER', 'Wide Body', B777_300, '7,370 nm', '396 pax', 'Mach 0.89', 'GE90-115B', 'wide'),
              card('Airbus A350-900', 'Wide Body', A350, '8,100 nm', '325 pax', 'Mach 0.85', 'Trent XWB', 'wide'),
              card('Airbus A380-800', 'Wide Body', A380, '8,000 nm', '555 pax', 'Mach 0.85', 'Trent 900 / GP7200', 'wide'),
          ]

          fleet_cards = [
              card('Airbus A321neo', 'Medium & Long Haul', A321NEO, '4,000 nm', '220 pax', 'Mach 0.78', 'LEAP-1A'),
              card('Airbus A320', 'Short & Medium Haul', A320, '3,300 nm', '180 pax', 'Mach 0.78', 'CFM56 / V2500'),
              card('Airbus A319', 'Short & Medium Haul', A319, '3,700 nm', '144 pax', 'Mach 0.78', 'CFM56 / V2500'),
              card('Boeing 737-700', 'Regional & Short Haul', B737_700, '3,440 nm', '128 pax', 'Mach 0.79', 'CFM56-7B'),
              card('Boeing 737-800', 'Short & Medium Haul', B737_800, '2,935 nm', '174 pax', 'Mach 0.79', 'CFM56-7B'),
              card('Boeing 737 MAX 8', 'Medium Haul', B737_MAX, '3,550 nm', '178 pax', 'Mach 0.79', 'LEAP-1B'),
              card('Boeing 787-8', 'Long Haul', B787, '7,355 nm', '242 pax', 'Mach 0.85', 'GEnx-1B / Trent 1000'),
              card('Airbus A320neo', 'Short & Medium Haul', A320NEO, '3,500 nm', '186 pax', 'Mach 0.78', 'LEAP-1A'),
              card('Boeing 777-300ER', 'Long Haul', B777_300, '7,370 nm', '396 pax', 'Mach 0.89', 'GE90-115B'),
              card('Airbus A380-800', 'Ultra Long Haul', A380, '8,000 nm', '555 pax', 'Mach 0.85', 'Trent 900 / GP7200'),
              card('Boeing 777-200', 'Long Haul', B777_200, '5,240 nm', '314 pax', 'Mach 0.84', 'GE90 / Trent 800 / PW4000'),
              card('Boeing 777-200LR', 'Ultra Long Haul', B777_200LR, '8,555 nm', '317 pax', 'Mach 0.84', 'GE90-110B1'),
              card('Airbus A350-900', 'Long Haul', A350, '8,100 nm', '325 pax', 'Mach 0.85', 'Trent XWB'),
          ]

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_container(index, 'fleet-grid', '\\n\\n'.join(index_cards))
          index_path.write_text(index, encoding='utf-8')

          fleet_path = Path('fleet.html')
          fleet = fleet_path.read_text(encoding='utf-8')
          fleet = replace_container(fleet, 'cards', '\\n\\n'.join(fleet_cards))
          fleet_path.write_text(fleet, encoding='utf-8')
          PY

      - name: Commit fleet changes and remove updater
        run: |
          rm -f .github/workflows/update-fleet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fleet.html .github/workflows/update-fleet.yml
          git commit -m "Update Echo Air Group fleet" || exit 0
          git push
